name: CI

on: 
    push:
        branches: [ main ]
    pull_request:
    workflow_dispatch:
    
jobs: 
    build: 
        runs-on: ubuntu-latest
        
        steps: 
            #1. 拉取HMCL源码
            - name: Checkout external repository
              uses: actions/checkout@v4
              with:
              repository: HMCL-dev/HMCL
              path: external-rope
              fetch-depth: 0
                
            #2. 配置Java25
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
              distribution: 'temurin'
              java-version: '25'
              cache: 'gradle'
            
            #3. 回滚#7017
            - name: Revert #7017
              working-directory: external-rope
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git revert -m 1 --no-edit 583e004 || {
                git rm -q --ignore-unmatch HMCL/src/main/java/org/jackhuang/hmcl/util/RegionUtils.java
                git -c core.editor=true revert --continue
                }