name: CI

on: 
    push:
        branches: [ main ]
    pull_request:
    
jobs: 
    build: 
        runs-on: ubuntu-latest
        
        steps: 
            #1. 拉取HMCL源码
          - name: Checkout external repository
            uses: actions/checkout@v6
            with: 
                repository: HMCL-dev/HMCL
                path: external-rope
                
            #2. 配置Java25
          - name: Set up JDK 25
            uses: actions/setup-java@v5
            with:
            distribution: 'temurin'
            java-version: '25'
            cache: 'gradle'
            
            #3. 回滚#7017
          - name: Revert #7017
            run: git revert -m 1 583e004
            working-directory: external-rope
            
            #4. 编译
          - name: Run Gradle build
            run: ./gradlew build --no-daemon --info --stacktrace
            working-directory: external-rope